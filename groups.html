<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Groups | InnoHub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/animations.css">
</head>

<body>

<header class="navbar">
  <div class="container nav-container">

    <a href="index.html" class="logo">
      <span class="logo-icon">IH</span>
      <span>Inno<span>Hub</span></span>
    </a>

    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>

    <nav id="mainNav">
      <a href="index.html">Home</a>
      <a href="projects.html">Projects</a>
      <a href="groups.html" class="active">Groups</a>
      <a href="upload.html" class="nav-upload">+ Upload Project</a>
    </nav>

  </div>
</header>

<main>

<section class="page-header">
  <div class="container">

    <span class="section-label">COLLABORATION</span>

    <h1>Innovation Groups</h1>

    <p>
      Create teams, collaborate on ideas and showcase everything
      your group builds.
    </p>

    <a href="create-group.html" class="btn btn-primary">
      + Create Group
    </a>

  </div>
</section>

<section class="section">

  <div class="container">

    <div class="search-box group-search">
      <span>⌕</span>

      <input
        type="search"
        id="groupSearch"
        placeholder="Search groups..."
      >
    </div>

    <div id="groupsContainer" class="group-grid large-grid"></div>

    <div id="emptyGroups" class="empty-state hidden">

      <div class="empty-icon">👥</div>

      <h3>No groups found</h3>

      <p>
        Create your first innovation group.
      </p>

      <a href="create-group.html" class="btn btn-primary">
        Create Group
      </a>

    </div>

  </div>

</section>

</main>

<footer class="footer">
  <div class="footer-bottom">
    © 2026 InnoHub
  </div>
</footer>

<script src="js/storage.js"></script>
<script src="js/main.js"></script>
<script src="js/groups.js"></script>

</body>
</html>
